import org.gradle.api.services.BuildService
import org.gradle.api.services.BuildServiceParameters
import org.gradle.api.tasks.JavaExec
import org.gradle.api.tasks.testing.Test

abstract class TemporalDevServerTestSemaphore
        implements BuildService<BuildServiceParameters.None>, AutoCloseable {
    @Override
    void close() {}
}

def devServerProfile = providers.gradleProperty('testServer')
        .map { it == 'dev-server' }
        .orElse(false)
def devServerCache =
        file("${gradle.gradleUserHomeDir}/caches/temporal-dev-server")
def devServerWorkingDirectory = layout.buildDirectory.dir('temporal-cli/server')

def devServerSemaphore = gradle.sharedServices.registerIfAbsent(
        'temporalDevServerTestSemaphore', TemporalDevServerTestSemaphore) {
    maxParallelUsages.set(1)
}

def prepareDevServerTests = tasks.register('prepareDevServerTests', JavaExec) {
    group = 'verification'
    description =
            'Caches the repository dev server and resolves inputs required by dev-server tests.'
    getMainClass().set('io.temporal.testing.internal.DevServerTestPreparation')
    systemProperty(
            'io.temporal.testing.internal.devServerDownloadDestination',
            devServerCache.absolutePath)
    systemProperty(
            'io.temporal.testing.internal.devServerDownloadEnabled',
            'true')
}

gradle.projectsEvaluated {
    List<Test> standardTestTasks = subprojects.collect { subproject ->
        subproject.tasks.findByName('test')
    }.findAll { task -> task instanceof Test } as List<Test>

    prepareDevServerTests.configure {
        classpath = project(':temporal-testing').sourceSets.main.runtimeClasspath
        dependsOn project(':temporal-testing').tasks.named('classes')
        dependsOn standardTestTasks.collect { testTask ->
            testTask.project.tasks.named('testClasses')
        }
        dependsOn project(':temporal-sdk').tasks.named('compileJava17Java')
        dependsOn project(':temporal-sdk').tasks.named('compileJava21Java')
        dependsOn project(':temporal-sdk').tasks.named('virtualThreadTestsClasses')
        doLast {
            standardTestTasks.each { testTask -> testTask.classpath.files }
            project(':temporal-sdk').tasks.named('virtualThreadTests', Test).get().classpath.files
        }
    }

    if (!devServerProfile.get()) {
        return
    }

    allprojects.each { candidateProject ->
        candidateProject.tasks.withType(Test).configureEach {
            usesService(devServerSemaphore)
            forkEvery = 0
            maxParallelForks = 1
            environment('USE_EXTERNAL_SERVICE', 'true')
            environment('TEMPORAL_SERVICE_ADDRESS', 'localhost:7233')
            systemProperty(
                    'io.temporal.testing.internal.devServerProfile',
                    'true')
            systemProperty(
                    'io.temporal.testing.internal.devServerDownloadDestination',
                    devServerCache.absolutePath)
            systemProperty(
                    'io.temporal.testing.internal.devServerDownloadEnabled',
                    (!gradle.startParameter.offline).toString())
            systemProperty(
                    'io.temporal.testing.internal.devServerWorkingDirectory',
                    devServerWorkingDirectory.get().asFile.absolutePath)
        }

        candidateProject.tasks.withType(JavaExec).matching {
            it.name == 'registerNamespace'
        }.configureEach {
            onlyIf { false }
        }
    }
}

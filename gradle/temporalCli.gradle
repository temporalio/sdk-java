import org.gradle.api.services.BuildService
import org.gradle.api.services.BuildServiceParameters
import org.gradle.api.tasks.JavaExec
import org.gradle.api.tasks.testing.Test
import org.gradle.jvm.toolchain.JavaLanguageVersion

import java.util.concurrent.TimeUnit

abstract class TemporalDevServerTestService
        implements BuildService<TemporalDevServerTestService.Parameters>, AutoCloseable {
    interface Parameters extends BuildServiceParameters {
        ListProperty<String> getClasspath()

        RegularFileProperty getJavaExecutable()
    }

    private Process process

    synchronized void start() {
        if (process != null) {
            if (!process.isAlive()) {
                throw new GradleException(
                        "Temporal dev-server owner exited with code ${process.exitValue()}")
            }
            return
        }

        List<String> command = [
                parameters.javaExecutable.get().asFile.absolutePath,
                '-cp',
                parameters.classpath.get().join(File.pathSeparator),
                'io.temporal.testing.internal.DevServerTestProcess',
        ].collect { it.toString() }

        process = new ProcessBuilder(command)
                .redirectError(ProcessBuilder.Redirect.INHERIT)
                .start()
        String ready = process.inputStream.newReader('UTF-8').readLine()
        if (ready != 'READY') {
            stop()
            throw new GradleException(
                    'Temporal dev-server owner exited before readiness; ' +
                            'see build/temporal-cli/server/server.log')
        }
    }

    @Override
    synchronized void close() {
        stop()
    }

    private void stop() {
        if (process == null) {
            return
        }
        try {
            process.outputStream.close()
            if (!process.waitFor(30, TimeUnit.SECONDS)) {
                process.destroyForcibly()
            }
        } catch (InterruptedException e) {
            Thread.currentThread().interrupt()
            process.destroyForcibly()
        } catch (IOException e) {
            process.destroyForcibly()
        } finally {
            process = null
        }
    }
}

def devServerProfile = providers.gradleProperty('testServer')
        .map { it == 'dev-server' }
        .orElse(false)
def devServerJavaLauncher = project(':temporal-testing').javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(JavaVersion.current().majorVersion as int)
}
def devServerService = gradle.sharedServices.registerIfAbsent(
        'temporalDevServerTestService', TemporalDevServerTestService) {
    parameters.javaExecutable.set(devServerJavaLauncher.map { it.executablePath })
    parameters.classpath.set(providers.provider {
        project(':temporal-testing').sourceSets.main.runtimeClasspath.files.collect {
            it.absolutePath
        }
    })
}

def prepareDevServerTests = tasks.register('prepareDevServerTests', JavaExec) {
    group = 'verification'
    description =
            'Caches the repository dev server and resolves inputs required by dev-server tests.'
    getMainClass().set('io.temporal.testing.internal.DevServerTestPreparation')
}

gradle.projectsEvaluated {
    List<Test> standardTestTasks = subprojects.collect { subproject ->
        subproject.tasks.findByName('test')
    }.findAll { task -> task instanceof Test } as List<Test>

    prepareDevServerTests.configure {
        classpath = project(':temporal-testing').sourceSets.main.runtimeClasspath
        dependsOn project(':temporal-testing').tasks.named('classes')
        dependsOn standardTestTasks.collect { testTask ->
            testTask.project.tasks.named('testClasses')
        }
        dependsOn project(':temporal-sdk').tasks.named('compileJava17Java')
        dependsOn project(':temporal-sdk').tasks.named('compileJava21Java')
        dependsOn project(':temporal-sdk').tasks.named('virtualThreadTestsClasses')
        doLast {
            standardTestTasks.each { testTask -> testTask.classpath.files }
            project(':temporal-sdk').tasks.named('virtualThreadTests', Test).get().classpath.files
        }
    }

    if (!devServerProfile.get()) {
        return
    }

    allprojects.each { candidateProject ->
        candidateProject.tasks.withType(Test).configureEach {
            dependsOn project(':temporal-testing').tasks.named('classes')
            usesService(devServerService)
            doFirst {
                devServerService.get().start()
            }
            environment('USE_EXTERNAL_SERVICE', 'true')
            environment('TEMPORAL_SERVICE_ADDRESS', 'localhost:7233')
            systemProperty(
                    'io.temporal.testing.internal.devServerProfile',
                    'true')
        }

        candidateProject.tasks.withType(JavaExec).matching {
            it.name == 'registerNamespace'
        }.configureEach {
            onlyIf { false }
        }
    }
}

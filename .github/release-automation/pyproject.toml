[project]
name = "sdk-java-release-automation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["temporalio==1.31.0"]

[dependency-groups]
dev = ["mypy==1.19.1", "pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.14.14"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "UP047"]

[tool.mypy]
python_version = "3.12"
strict = true

name: Approve Temporal-backed release
run-name: ${{ github.event_name == 'issues' && 'Approve exact release by closing its locked issue' || 'Create exact release approval requests' }}

on:
  workflow_dispatch:
  schedule:
    - cron: "4,19,34,49 * * * *"
  issues:
    types:
      - closed

permissions:
  contents: read
  issues: read

env:
  RELEASE_AUTOMATION_COMPATIBLE_REFS: ${{ vars.RELEASE_AUTOMATION_COMPATIBLE_REFS }}
  TEMPORAL_ADDRESS: ${{ secrets.TEMPORAL_RELEASE_ADDRESS }}
  TEMPORAL_NAMESPACE: ${{ secrets.TEMPORAL_RELEASE_NAMESPACE }}
  TEMPORAL_API_KEY: ${{ secrets.TEMPORAL_RELEASE_APPROVAL_API_KEY }}
  RELEASE_AUTOMATION_REF: ${{ vars.RELEASE_AUTOMATION_REF }}
  GITHUB_TRIGGERING_ACTOR: ${{ github.actor }}
  APPROVAL_ISSUE_NUMBER: ${{ github.event.issue.number || 0 }}

jobs:
  discover_requests:
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-control
    outputs:
      request_count: ${{ steps.split.outputs.request_count }}
      request_matrix: ${{ steps.split.outputs.request_matrix }}
      recovery_count: ${{ steps.split.outputs.recovery_count }}
      recovery_matrix: ${{ steps.split.outputs.recovery_matrix }}
    steps:
      - name: Validate trusted automation pin
        run: '[[ "$RELEASE_AUTOMATION_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ vars.RELEASE_AUTOMATION_REF }}
      - name: Verify trusted checkout
        run: '[[ "$(git rev-parse HEAD)" == "$RELEASE_AUTOMATION_REF" ]]'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ac396bf1a80af16236baf54bd7330ae21dc6ece5 # v6
      - name: Discover every unrequested exact release
        id: discover
        run: ./gradlew -p .github/release-automation run --args="discover approvals"
      - name: Split new requests from closed-issue recovery
        id: split
        env:
          DISCOVERY_MATRIX: ${{ steps.discover.outputs.matrix }}
        run: |
          request=$(jq -c '{include:[.include[] | select(.role == "approval")]}' \
            <<<"$DISCOVERY_MATRIX")
          recovery=$(jq -c '{include:[.include[] | select(.role == "approval-recovery")]}' \
            <<<"$DISCOVERY_MATRIX")
          {
            echo "request_count=$(jq '.include | length' <<<"$request")"
            echo "request_matrix=$request"
            echo "recovery_count=$(jq '.include | length' <<<"$recovery")"
            echo "recovery_matrix=$recovery"
          } >>"$GITHUB_OUTPUT"

  request:
    name: Request approval for ${{ matrix.tag }}
    needs: discover_requests
    if: needs.discover_requests.outputs.request_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover_requests.outputs.request_matrix) }}
    runs-on: ubuntu-latest
    environment: release-control
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: approval-request-${{ matrix.workflowId }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ matrix.automationCommit }}
      - name: Verify frozen Worker checkout
        env:
          FROZEN_AUTOMATION_COMMIT: ${{ matrix.automationCommit }}
          IDENTITY_AUTOMATION_COMMIT: ${{ matrix.automationCommit }}
        run: '[[ "$IDENTITY_AUTOMATION_COMMIT" == "$FROZEN_AUTOMATION_COMMIT" && "$(git rev-parse HEAD)" == "$FROZEN_AUTOMATION_COMMIT" ]]'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ac396bf1a80af16236baf54bd7330ae21dc6ece5 # v6
      - name: Obtain immutable approval-receipt credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.RELEASE_CONTROL_ARTIFACT_ROLE_ARN }}
      - name: Create immutable approval issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.RELEASE_APPROVAL_GITHUB_TOKEN }}
          COMMIT_SHA: ${{ matrix.commitSha }}
          MANIFEST_SHA256: ${{ matrix.manifestSha256 }}
          NOTES_SHA256: ${{ matrix.notesSha256 }}
          RELEASE_DIGEST: ${{ matrix.releaseDigest }}
          RELEASE_ARTIFACT_BUCKET: ${{ vars.RELEASE_ARTIFACT_BUCKET }}
          RELEASE_TAG: ${{ matrix.tag }}
          RUN_ID: ${{ matrix.runId }}
          TRUSTED_AUTOMATION_COMMIT: ${{ matrix.automationCommit }}
          WORKFLOW_ID: ${{ matrix.workflowId }}
        run: |
          body=$(printf '%s\n' \
            '## Exact sdk-java release approval' \
            '' \
            "- Tag: \`$RELEASE_TAG\`" \
            "- Full commit SHA: \`$COMMIT_SHA\`" \
            "- Release-note SHA-256: \`$NOTES_SHA256\`" \
            "- Artifact-manifest SHA-256: \`$MANIFEST_SHA256\`" \
            "- Release digest: \`$RELEASE_DIGEST\`" \
            "- Temporal Workflow: \`$WORKFLOW_ID\`" \
            "- Temporal Run: \`$RUN_ID\`" \
            '' \
            'An active temporalio/sdk team member approves this exact identity by clicking **Close issue**. Do not edit this issue.')
          printf '%s' "$body" >"$RUNNER_TEMP/approval-body.md"
          title="[sdk-java release approval] $RELEASE_TAG at $COMMIT_SHA"
          approval_creator=$(gh api user --jq .login)
          issues=$(gh api --paginate --slurp \
            'repos/temporalio/sdk-java/issues?state=all&per_page=100')
          matches=$(jq -c --arg title "$title" --arg body "$body" --arg creator "$approval_creator" \
            '[.[][] | select((has("pull_request") | not) and .title == $title and
              .body == $body and .user.login == $creator)]' \
            <<<"$issues")
          [[ $(jq 'length' <<<"$matches") -le 1 ]]
          if [[ $(jq 'length' <<<"$matches") -eq 1 ]]; then
            issue=$(jq -c '.[0]' <<<"$matches")
          else
            issue=$(gh api --method POST repos/temporalio/sdk-java/issues \
              --raw-field title="$title" --raw-field body="$body")
          fi
          number=$(jq -er .number <<<"$issue")
          node_id=$(jq -er .node_id <<<"$issue")
          body_sha256=$(sha256sum "$RUNNER_TEMP/approval-body.md" | awk '{print $1}')
          gh api --method PUT "repos/temporalio/sdk-java/issues/$number/lock"
          receipt="$RUNNER_TEMP/approval-request.json"
          jq -cn --arg repository temporalio/sdk-java --arg releaseDigest "$RELEASE_DIGEST" \
            --arg workflowId "$WORKFLOW_ID" --arg runId "$RUN_ID" \
            --argjson issueNumber "$number" \
            --arg issueNodeId "$node_id" --arg issueBodySha256 "$body_sha256" \
            --arg issueCreator "$approval_creator" \
            --arg trustedAutomationCommit "$TRUSTED_AUTOMATION_COMMIT" \
            '{repository:$repository,releaseDigest:$releaseDigest,workflowId:$workflowId,
              runId:$runId,issueNumber:$issueNumber,
              issueNodeId:$issueNodeId,issueBodySha256:$issueBodySha256,
              issueCreator:$issueCreator,trustedAutomationCommit:$trustedAutomationCommit}' \
            >"$receipt"
          receipt_key="sdk-java/$RELEASE_DIGEST/state/approval-request.json"
          if ! aws s3api put-object --bucket "$RELEASE_ARTIFACT_BUCKET" \
            --key "$receipt_key" --body "$receipt" --if-none-match '*' >/dev/null 2>&1; then
            aws s3 cp "s3://$RELEASE_ARTIFACT_BUCKET/$receipt_key" \
              "$RUNNER_TEMP/existing-approval-request.json" --no-progress >/dev/null
            cmp -s "$receipt" "$RUNNER_TEMP/existing-approval-request.json"
          fi
          {
            echo "number=$number"
            echo "node_id=$node_id"
            echo "body_sha256=$body_sha256"
            echo "url=$(jq -er .html_url <<<"$issue")"
          } >>"$GITHUB_OUTPUT"
      - name: Record release-specific approval request
        env:
          APPROVAL_ISSUE_BODY_SHA256: ${{ steps.issue.outputs.body_sha256 }}
          APPROVAL_ISSUE_NODE_ID: ${{ steps.issue.outputs.node_id }}
          APPROVAL_ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          EXPECTED_WORKFLOW_ID: ${{ matrix.workflowId }}
          GH_TOKEN: ${{ secrets.RELEASE_APPROVAL_GITHUB_TOKEN }}
          RELEASE_AUTOMATION_REF: ${{ matrix.automationCommit }}
        run: ./gradlew -p .github/release-automation run --args="approval-request"
      - name: Summarize approval request
        env:
          APPROVAL_URL: ${{ steps.issue.outputs.url }}
        run: |
          {
            echo "## Exact approval requested"
            echo
            echo "Inspect the immutable identity in [$APPROVAL_URL]($APPROVAL_URL), then approve by clicking **Close issue**."
            echo "The locked issue does not expire and requires no text input."
          } >>"$GITHUB_STEP_SUMMARY"

  recover_closed_issue:
    name: Recover approval for ${{ matrix.tag }}
    needs: discover_requests
    if: needs.discover_requests.outputs.recovery_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover_requests.outputs.recovery_matrix) }}
    runs-on: ubuntu-latest
    environment: release-control
    concurrency:
      group: approval-request-${{ matrix.workflowId }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ matrix.automationCommit }}
      - name: Verify frozen Worker checkout
        env:
          FROZEN_AUTOMATION_COMMIT: ${{ matrix.automationCommit }}
          IDENTITY_AUTOMATION_COMMIT: ${{ matrix.automationCommit }}
        run: '[[ "$IDENTITY_AUTOMATION_COMMIT" == "$FROZEN_AUTOMATION_COMMIT" && "$(git rev-parse HEAD)" == "$FROZEN_AUTOMATION_COMMIT" ]]'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ac396bf1a80af16236baf54bd7330ae21dc6ece5 # v6
      - name: Inspect the exact bound issue
        id: issue
        env:
          EXPECTED_BODY_SHA256: ${{ matrix.approvalIssueBodySha256 }}
          EXPECTED_NODE_ID: ${{ matrix.approvalIssueNodeId }}
          GH_TOKEN: ${{ secrets.RELEASE_APPROVAL_GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ matrix.approvalIssueNumber }}
        run: |
          issue=$(gh api "repos/temporalio/sdk-java/issues/$ISSUE_NUMBER")
          [[ $(jq -r .state <<<"$issue") == closed ]] || exit 0
          body=$(jq -r .body <<<"$issue")
          body_sha256=$(printf '%s' "$body" | sha256sum | awk '{print $1}')
          jq -e --arg node "$EXPECTED_NODE_ID" \
            '.node_id == $node and .locked == true and
             (.closed_by.login | test("^[A-Za-z0-9-]{1,39}$"))' <<<"$issue" >/dev/null
          [[ "$body_sha256" == "$EXPECTED_BODY_SHA256" ]]
          {
            echo "closed=true"
            echo "actor=$(jq -er .closed_by.login <<<"$issue")"
            echo "body_sha256=$body_sha256"
          } >>"$GITHUB_OUTPUT"
      - name: Recover the approval Update from the durable closed issue
        if: steps.issue.outputs.closed == 'true'
        env:
          APPROVAL_ISSUE_BODY_SHA256: ${{ steps.issue.outputs.body_sha256 }}
          APPROVAL_ISSUE_NODE_ID: ${{ matrix.approvalIssueNodeId }}
          APPROVAL_ISSUE_NUMBER: ${{ matrix.approvalIssueNumber }}
          GH_TOKEN: ${{ secrets.RELEASE_APPROVAL_GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: schedule
          GITHUB_TRIGGERING_ACTOR: ${{ steps.issue.outputs.actor }}
          RELEASE_AUTOMATION_REF: ${{ matrix.automationCommit }}
        run: ./gradlew -p .github/release-automation run --args="approve"

  approve:
    if: >-
      github.event_name == 'issues' && github.ref == 'refs/heads/main' &&
      startsWith(github.event.issue.title, '[sdk-java release approval]')
    runs-on: ubuntu-latest
    environment: release-control
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: bootstrap
          ref: ${{ vars.RELEASE_AUTOMATION_REF }}
      - name: Verify bootstrap checkout
        env:
          RELEASE_AUTOMATION_REF: ${{ vars.RELEASE_AUTOMATION_REF }}
        run: '[[ "$RELEASE_AUTOMATION_REF" =~ ^[0-9a-f]{40}$ && "$(git -C bootstrap rev-parse HEAD)" == "$RELEASE_AUTOMATION_REF" ]]'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ac396bf1a80af16236baf54bd7330ae21dc6ece5 # v6
      - name: Resolve the release bound to this issue
        id: target
        working-directory: bootstrap
        run: ./gradlew -p .github/release-automation run --args="approval-target"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: automation
          ref: ${{ steps.target.outputs.automation_commit }}
      - name: Verify protected automation identity
        env:
          IDENTITY_AUTOMATION_COMMIT: ${{ steps.target.outputs.automation_commit }}
          RELEASE_AUTOMATION_REF: ${{ vars.RELEASE_AUTOMATION_REF }}
        run: |
          [[ ",$RELEASE_AUTOMATION_REF,$RELEASE_AUTOMATION_COMPATIBLE_REFS," ==
            *",$IDENTITY_AUTOMATION_COMMIT,"* ]]
          [[ "$(git -C automation rev-parse HEAD)" == "$IDENTITY_AUTOMATION_COMMIT" ]]
      - name: Read exact closed-issue event identity
        id: event
        run: |
          python3 - "$GITHUB_EVENT_PATH" "$GITHUB_OUTPUT" <<'PY'
          import hashlib, json, sys
          issue = json.load(open(sys.argv[1], encoding="utf-8"))["issue"]
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              output.write(f"number={issue['number']}\n")
              output.write(f"node_id={issue['node_id']}\n")
              output.write(f"body_sha256={hashlib.sha256(issue['body'].encode()).hexdigest()}\n")
          PY
      - name: Submit approval Update for the exact closed issue
        id: approve
        working-directory: automation
        env:
          APPROVAL_ISSUE_BODY_SHA256: ${{ steps.event.outputs.body_sha256 }}
          APPROVAL_ISSUE_NODE_ID: ${{ steps.event.outputs.node_id }}
          APPROVAL_ISSUE_NUMBER: ${{ steps.event.outputs.number }}
          GH_TOKEN: ${{ secrets.RELEASE_APPROVAL_GITHUB_TOKEN }}
          RELEASE_AUTOMATION_REF: ${{ steps.target.outputs.automation_commit }}
        run: ./gradlew -p .github/release-automation run --args="approve"
      - name: Summarize accepted approval
        env:
          RELEASE_DIGEST: ${{ steps.approve.outputs.release_digest }}
          RELEASE_TAG: ${{ steps.approve.outputs.tag }}
        run: |
          {
            echo "## Release approved"
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Release digest: \`$RELEASE_DIGEST\`"
            echo "- Approval issue: \`#$APPROVAL_ISSUE_NUMBER\`"
          } >>"$GITHUB_STEP_SUMMARY"

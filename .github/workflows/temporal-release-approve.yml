name: Approve Temporal-backed release
run-name: ${{ github.event_name == 'issues' && 'Approve exact release by closing its locked issue' || 'Create exact release approval requests' }}

on:
  workflow_dispatch:
  schedule:
    - cron: "4,19,34,49 * * * *"
  issues:
    types:
      - closed

permissions:
  contents: read
  issues: read

env:
  TEMPORAL_ADDRESS: ${{ secrets.TEMPORAL_RELEASE_ADDRESS }}
  TEMPORAL_NAMESPACE: ${{ secrets.TEMPORAL_RELEASE_NAMESPACE }}
  TEMPORAL_API_KEY: ${{ secrets.TEMPORAL_RELEASE_APPROVAL_API_KEY }}
  RELEASE_AUTOMATION_REF: ${{ vars.RELEASE_AUTOMATION_REF }}
  GITHUB_TRIGGERING_ACTOR: ${{ github.actor }}
  APPROVAL_ISSUE_NUMBER: ${{ github.event.issue.number || 0 }}

jobs:
  discover_requests:
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-control
    outputs:
      count: ${{ steps.discover.outputs.count }}
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Validate trusted automation pin
        run: '[[ "$RELEASE_AUTOMATION_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ vars.RELEASE_AUTOMATION_REF }}
      - name: Verify trusted checkout
        run: '[[ "$(git rev-parse HEAD)" == "$RELEASE_AUTOMATION_REF" ]]'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "23"
      - uses: gradle/actions/setup-gradle@ac396bf1a80af16236baf54bd7330ae21dc6ece5 # v6
      - name: Discover every unrequested exact release
        id: discover
        run: ./gradlew -p .github/release-automation run --args="discover approvals"

  request:
    name: Request approval for ${{ matrix.tag }}
    needs: discover_requests
    if: needs.discover_requests.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover_requests.outputs.matrix) }}
    runs-on: ubuntu-latest
    environment: release-control
    concurrency:
      group: approval-request-${{ matrix.workflowId }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ matrix.automationCommit }}
      - name: Verify frozen Worker checkout
        env:
          FROZEN_AUTOMATION_COMMIT: ${{ matrix.automationCommit }}
        run: '[[ "$(git rev-parse HEAD)" == "$FROZEN_AUTOMATION_COMMIT" ]]'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "23"
      - uses: gradle/actions/setup-gradle@ac396bf1a80af16236baf54bd7330ae21dc6ece5 # v6
      - name: Create immutable approval issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.RELEASE_APPROVAL_GITHUB_TOKEN }}
          COMMIT_SHA: ${{ matrix.commitSha }}
          MANIFEST_SHA256: ${{ matrix.manifestSha256 }}
          NOTES_SHA256: ${{ matrix.notesSha256 }}
          RELEASE_DIGEST: ${{ matrix.releaseDigest }}
          RELEASE_TAG: ${{ matrix.tag }}
          RUN_ID: ${{ matrix.runId }}
          WORKFLOW_ID: ${{ matrix.workflowId }}
        run: |
          body=$(printf '%s\n' \
            '## Exact sdk-java release approval' \
            '' \
            "- Tag: \`$RELEASE_TAG\`" \
            "- Full commit SHA: \`$COMMIT_SHA\`" \
            "- Release-note SHA-256: \`$NOTES_SHA256\`" \
            "- Artifact-manifest SHA-256: \`$MANIFEST_SHA256\`" \
            "- Release digest: \`$RELEASE_DIGEST\`" \
            "- Temporal Workflow: \`$WORKFLOW_ID\`" \
            "- Temporal Run: \`$RUN_ID\`" \
            '' \
            'An active sdk-java release manager approves this exact identity by clicking **Close issue**. Do not edit this issue.')
          printf '%s' "$body" >"$RUNNER_TEMP/approval-body.md"
          title="[sdk-java release approval] $RELEASE_TAG at $COMMIT_SHA"
          issues=$(gh api --paginate --slurp \
            'repos/temporalio/sdk-java/issues?state=open&per_page=100')
          matches=$(jq -c --arg title "$title" --arg body "$body" \
            '[.[][] | select((has("pull_request") | not) and .title == $title and .body == $body)]' \
            <<<"$issues")
          [[ $(jq 'length' <<<"$matches") -le 1 ]]
          if [[ $(jq 'length' <<<"$matches") -eq 1 ]]; then
            issue=$(jq -c '.[0]' <<<"$matches")
          else
            issue=$(gh api --method POST repos/temporalio/sdk-java/issues \
              --raw-field title="$title" --raw-field body="$body")
          fi
          number=$(jq -er .number <<<"$issue")
          {
            echo "number=$number"
            echo "node_id=$(jq -er .node_id <<<"$issue")"
            echo "body_sha256=$(sha256sum "$RUNNER_TEMP/approval-body.md" | awk '{print $1}')"
            echo "url=$(jq -er .html_url <<<"$issue")"
          } >>"$GITHUB_OUTPUT"
          gh api --method PUT "repos/temporalio/sdk-java/issues/$number/lock"
      - name: Record release-specific approval request
        env:
          APPROVAL_ISSUE_BODY_SHA256: ${{ steps.issue.outputs.body_sha256 }}
          APPROVAL_ISSUE_NODE_ID: ${{ steps.issue.outputs.node_id }}
          APPROVAL_ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          EXPECTED_WORKFLOW_ID: ${{ matrix.workflowId }}
          GH_TOKEN: ${{ secrets.RELEASE_APPROVAL_GITHUB_TOKEN }}
          RELEASE_AUTOMATION_REF: ${{ matrix.automationCommit }}
        run: ./gradlew -p .github/release-automation run --args="approval-request"
      - name: Summarize approval request
        env:
          APPROVAL_URL: ${{ steps.issue.outputs.url }}
        run: |
          {
            echo "## Exact approval requested"
            echo
            echo "Inspect the immutable identity in [$APPROVAL_URL]($APPROVAL_URL), then approve by clicking **Close issue**."
            echo "The locked issue does not expire and requires no text input."
          } >>"$GITHUB_STEP_SUMMARY"

  approve:
    if: >-
      github.event_name == 'issues' && github.ref == 'refs/heads/main' &&
      startsWith(github.event.issue.title, '[sdk-java release approval]')
    runs-on: ubuntu-latest
    environment: release-control
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: bootstrap
          ref: ${{ vars.RELEASE_AUTOMATION_REF }}
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "23"
      - uses: gradle/actions/setup-gradle@ac396bf1a80af16236baf54bd7330ae21dc6ece5 # v6
      - name: Resolve the release bound to this issue
        id: target
        working-directory: bootstrap
        run: ./gradlew -p .github/release-automation run --args="approval-target"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: automation
          ref: ${{ steps.target.outputs.automation_commit }}
      - name: Read exact closed-issue event identity
        id: event
        run: |
          python3 - "$GITHUB_EVENT_PATH" "$GITHUB_OUTPUT" <<'PY'
          import hashlib, json, sys
          issue = json.load(open(sys.argv[1], encoding="utf-8"))["issue"]
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              output.write(f"number={issue['number']}\n")
              output.write(f"node_id={issue['node_id']}\n")
              output.write(f"body_sha256={hashlib.sha256(issue['body'].encode()).hexdigest()}\n")
          PY
      - name: Submit approval Update for the exact closed issue
        id: approve
        working-directory: automation
        env:
          APPROVAL_ISSUE_BODY_SHA256: ${{ steps.event.outputs.body_sha256 }}
          APPROVAL_ISSUE_NODE_ID: ${{ steps.event.outputs.node_id }}
          APPROVAL_ISSUE_NUMBER: ${{ steps.event.outputs.number }}
          GH_TOKEN: ${{ secrets.RELEASE_APPROVAL_GITHUB_TOKEN }}
          RELEASE_AUTOMATION_REF: ${{ steps.target.outputs.automation_commit }}
        run: ./gradlew -p .github/release-automation run --args="approve"
      - name: Summarize accepted approval
        env:
          RELEASE_DIGEST: ${{ steps.approve.outputs.release_digest }}
          RELEASE_TAG: ${{ steps.approve.outputs.tag }}
        run: |
          {
            echo "## Release approved"
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Release digest: \`$RELEASE_DIGEST\`"
            echo "- Approval issue: \`#$APPROVAL_ISSUE_NUMBER\`"
          } >>"$GITHUB_STEP_SUMMARY"

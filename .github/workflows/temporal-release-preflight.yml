name: Release-note candidate preflight

on:
  pull_request:
    paths:
      - "releases/v*"
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.matrix.outputs.count }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Discover main or maintenance release-note proposals
        id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : >"$RUNNER_TEMP/preflight.jsonl"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            jq -cn --arg head '${{ github.event.pull_request.head.sha }}' \
              --arg base '${{ github.event.pull_request.base.sha }}' \
              --argjson number '${{ github.event.pull_request.number }}' \
              '{headSha:$head,baseSha:$base,pullRequest:$number}' \
              >>"$RUNNER_TEMP/preflight.jsonl"
          else
            gh api --paginate --slurp 'repos/temporalio/sdk-java/pulls?state=open&per_page=100' \
              >"$RUNNER_TEMP/pulls.json"
            while IFS=$'\t' read -r number base head branch; do
              if [[ "$branch" != main && "$branch" != v*.x && "$branch" != *.*.x &&
                "$branch" != release_*_x && "$branch" != releases/* ]]; then
                continue
              fi
              files=$(gh api --paginate --slurp \
                "repos/temporalio/sdk-java/pulls/$number/files?per_page=100")
              jq -e '[.[][] | select(.filename | startswith("releases/v"))] | length > 0' \
                <<<"$files" >/dev/null || continue
              jq -cn --arg head "$head" --arg base "$base" --argjson number "$number" \
                '{headSha:$head,baseSha:$base,pullRequest:$number}' \
                >>"$RUNNER_TEMP/preflight.jsonl"
            done < <(jq -r '.[][] | [.number,.base.sha,.head.sha,.base.ref] | @tsv' \
              "$RUNNER_TEMP/pulls.json")
          fi
          matrix=$(jq -sc '{include:.}' "$RUNNER_TEMP/preflight.jsonl")
          {
            echo "count=$(jq '.include | length' <<<"$matrix")"
            echo "matrix=$matrix"
          } >>"$GITHUB_OUTPUT"

  validate:
    needs: discover
    if: needs.discover.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate trusted automation pin
        env:
          RELEASE_AUTOMATION_REF: ${{ vars.RELEASE_AUTOMATION_REF }}
        run: '[[ "$RELEASE_AUTOMATION_REF" =~ ^[0-9a-f]{40}$ ]]'
      - name: Checkout immutable proposed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          ref: ${{ matrix.headSha }}
      - name: Checkout trusted release automation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: automation
          ref: ${{ vars.RELEASE_AUTOMATION_REF }}
      - name: Verify trusted checkout
        env:
          RELEASE_AUTOMATION_REF: ${{ vars.RELEASE_AUTOMATION_REF }}
        run: '[[ "$(git -C automation rev-parse HEAD)" == "$RELEASE_AUTOMATION_REF" ]]'
      - uses: ./automation/.github/release-automation/setup
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ac396bf1a80af16236baf54bd7330ae21dc6ece5 # v6
      - name: Validate immutable candidate metadata and prerequisites
        id: candidate
        working-directory: source
        env:
          BASE_SHA: ${{ matrix.baseSha }}
          RELEASE_AUTOMATION_REF: ${{ vars.RELEASE_AUTOMATION_REF }}
          RELEASE_COMMIT: ${{ matrix.headSha }}
          TRUSTED_AUTOMATION_ROOT: ${{ github.workspace }}/automation
        run: ../automation/.github/scripts/temporal-release/resolve-candidate.sh
      - name: Validate generated group, artifacts, version, SHA, and Nexus tasks
        working-directory: source
        env:
          RELEASE_CANDIDATE_FILE: ${{ steps.candidate.outputs.candidate_file }}
          TRUSTED_AUTOMATION_ROOT: ${{ github.workspace }}/automation
        run: ../automation/.github/scripts/temporal-release/validate-publication-model.sh

name: Release-note candidate preflight

on:
  pull_request:
    paths:
      - "releases/v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate trusted automation pin
        env:
          RELEASE_AUTOMATION_REF: ${{ vars.RELEASE_AUTOMATION_REF }}
        run: '[[ "$RELEASE_AUTOMATION_REF" =~ ^[0-9a-f]{40}$ ]]'
      - name: Checkout immutable proposed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          path: source
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout trusted release automation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: automation
          ref: ${{ vars.RELEASE_AUTOMATION_REF }}
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "23"
      - uses: gradle/actions/setup-gradle@ac396bf1a80af16236baf54bd7330ae21dc6ece5 # v6
      - name: Validate immutable candidate metadata and prerequisites
        id: candidate
        working-directory: source
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASE_AUTOMATION_REF: ${{ vars.RELEASE_AUTOMATION_REF }}
          RELEASE_COMMIT: ${{ github.event.pull_request.head.sha }}
          TRUSTED_AUTOMATION_ROOT: ${{ github.workspace }}/automation
        run: ../automation/.github/scripts/temporal-release/resolve-candidate.sh
      - name: Validate trusted Gradle hooks and exact generated POM provenance
        working-directory: source
        env:
          RELEASE_CANDIDATE_FILE: ${{ steps.candidate.outputs.candidate_file }}
          TRUSTED_AUTOMATION_ROOT: ${{ github.workspace }}/automation
        run: ../automation/.github/scripts/temporal-release/validate-publication-model.sh

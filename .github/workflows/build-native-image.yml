name: Native image builder (reusable)
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail -O nullglob {0}
on:
  workflow_dispatch:
    inputs:
      ref:
        type: string
        description: "Exact full 40-character release commit SHA"
        required: true
      tag:
        type: string
        description: "Exact release tag"
        required: true
      notes_sha256:
        type: string
        description: "Exact release-note SHA-256"
        required: true
      upload_artifact:
        type: boolean
        description: "Upload the native test server executable as an artifact"
        required: true
        default: true
  workflow_call:
    inputs:
      ref:
        type: string
        description: "Exact full 40-character release commit SHA"
        required: true
      tag:
        type: string
        description: "Exact release tag"
        required: false
        default: ""
      notes_sha256:
        type: string
        description: "Exact release-note SHA-256"
        required: false
        default: ""
      upload_artifact:
        type: boolean
        description: "Upload the native test server executable as an artifact"
        required: false
        default: false
env:
  INPUT_REF: ${{ inputs.ref }}
  INPUT_TAG: ${{ inputs.tag }}
  INPUT_NOTES_SHA256: ${{ inputs.notes_sha256 }}

jobs:
  build_native_images:
    name: Build native test server
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os_family: linux
            arch: amd64
            musl: true
          - runner: ubuntu-latest
            os_family: linux
            arch: amd64
            musl: false
          - runner: macos-15-intel
            os_family: macOS
            arch: amd64
          - runner: macos-latest
            os_family: macOS
            arch: arm64
          - runner: ubuntu-24.04-arm
            os_family: linux
            arch: arm64
          - runner: windows-latest
            os_family: windows
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Validate exact immutable inputs
        run: |
          [[ "$INPUT_REF" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "$INPUT_TAG" || -n "$INPUT_NOTES_SHA256" ]]; then
            [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-RC[0-9]+)?$ ]]
            [[ "$INPUT_NOTES_SHA256" =~ ^[0-9a-f]{64}$ ]]
          fi
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
          ref: ${{ env.INPUT_REF }}
      - name: Verify checkout and release-note identity
        if: inputs.tag != ''
        run: |
          [[ "$(git rev-parse HEAD)" == "$INPUT_REF" ]]
          [[ -s "releases/$INPUT_TAG" && ! -L "releases/$INPUT_TAG" ]]
          [[ "$(sha256sum "releases/$INPUT_TAG" | awk '{print $1}')" == "$INPUT_NOTES_SHA256" ]]
          if git rev-parse --verify "refs/tags/$INPUT_TAG" >/dev/null 2>&1; then
            [[ "$(git rev-list -n1 "$INPUT_TAG")" == "$INPUT_REF" ]]
          else
            git tag "$INPUT_TAG" "$INPUT_REF"
          fi

      - name: Checkout frozen fallback build containers
        if: matrix.os_family == 'linux'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: manual-tools
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Set up Java
        if: matrix.os_family != 'linux'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17.0.9"
          distribution: "graalvm-community"

      - name: Set up Gradle
        if: matrix.os_family != 'linux'
        uses: gradle/actions/setup-gradle@ac396bf1a80af16236baf54bd7330ae21dc6ece5 # v6

      - name: Build native test server (non-Docker)
        if: matrix.os_family != 'linux'
        run: |
          gradle_args=(-PnativeBuild :temporal-test-server:nativeCompile)
          [[ -n "$INPUT_TAG" ]] && gradle_args=("-PreleaseVersion=${INPUT_TAG#v}" "${gradle_args[@]}")
          ./gradlew "${gradle_args[@]}"

      - name: Build native test server (Docker non-musl)
        if: matrix.os_family == 'linux' && matrix.musl == false
        run: |
          IMAGE_ID_FILE="$(mktemp)"
          docker_context=manual-tools/.github/release-automation/docker/native-image-java17
          docker build --iidfile "$IMAGE_ID_FILE" "$docker_context"
          IMAGE_ID="$(cat "$IMAGE_ID_FILE")"
          gradle_args=(-PnativeBuild :temporal-test-server:nativeCompile)
          [[ -n "$INPUT_TAG" ]] && gradle_args=("-PreleaseVersion=${INPUT_TAG#v}" "${gradle_args[@]}")
          docker run \
            --rm -w /github/workspace -v "$(pwd):/github/workspace" \
            "$IMAGE_ID" ./gradlew "${gradle_args[@]}"

      - name: Build native test server (Docker musl)
        if: matrix.os_family == 'linux' && matrix.musl == true
        run: |
          IMAGE_ID_FILE="$(mktemp)"
          docker_context=manual-tools/.github/release-automation/docker/native-image-musl-java17
          docker build --iidfile "$IMAGE_ID_FILE" "$docker_context"
          IMAGE_ID="$(cat "$IMAGE_ID_FILE")"
          gradle_args=(-PnativeBuild -PnativeBuildMusl :temporal-test-server:nativeCompile)
          [[ -n "$INPUT_TAG" ]] && gradle_args=("-PreleaseVersion=${INPUT_TAG#v}" "${gradle_args[@]}")
          docker run \
            --rm -w /github/workspace -v "$(pwd):/github/workspace" \
            "$IMAGE_ID" ./gradlew "${gradle_args[@]}"

      # path ends in a wildcard because on windows the file ends in '.exe'
      - name: Upload executable to workflow
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: ${{ matrix.musl && format('{0}_{1}_musl', matrix.os_family, matrix.arch) || format('{0}_{1}', matrix.os_family, matrix.arch)}}
          path: |
            temporal-test-server/build/native/nativeCompile/temporal-test-server*
          if-no-files-found: error
          retention-days: 90

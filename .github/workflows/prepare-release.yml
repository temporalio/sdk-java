name: Independent manual release fallback
run-name: Manual ${{ inputs.action }} for ${{ inputs.tag }} at ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Fixed manual fallback operation
        required: true
        type: choice
        options:
          - inspect
          - resume
      tag:
        description: Exact release tag
        required: true
        type: string
      commit_sha:
        description: Exact full 40-character source commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-publication
    outputs:
      controller_sha: ${{ steps.identity.outputs.controller_sha }}
      notes_sha256: ${{ steps.identity.outputs.notes_sha256 }}
    steps:
      - name: Validate exact immutable inputs
        env:
          RELEASE_COMMIT: ${{ inputs.commit_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-RC[0-9]+)?$ ]]
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha }}
      - name: Verify exact source, notes, and release manager
        id: identity
        env:
          GH_TOKEN: ${{ secrets.RELEASE_APPROVAL_GITHUB_TOKEN }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_COMMIT: ${{ inputs.commit_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$RELEASE_COMMIT" ]]
          [[ -s "releases/$RELEASE_TAG" && ! -L "releases/$RELEASE_TAG" ]]
          membership=$(gh api \
            "orgs/temporalio/teams/sdk-java-release-managers/memberships/$GITHUB_TRIGGERING_ACTOR")
          jq -e '.state == "active" and (.role == "member" or .role == "maintainer")' \
            <<<"$membership" >/dev/null
          title="[sdk-java manual release ownership] $RELEASE_TAG"
          issues=$(gh api --paginate --slurp \
            'repos/temporalio/sdk-java/issues?state=open&per_page=100')
          matches=$(jq -c --arg title "$title" \
            '[.[][] | select((has("pull_request") | not) and .title == $title)]' <<<"$issues")
          [[ $(jq 'length' <<<"$matches") -le 1 ]]
          if [[ $(jq 'length' <<<"$matches") == 1 ]]; then
            body=$(jq -r '.[0].body' <<<"$matches")
            [[ "$body" == *"- Full SHA: \`$RELEASE_COMMIT\`"* ]]
            controller_sha=$(sed -n -E \
              's/^- Controller SHA: `([0-9a-f]{40})`$/\1/p' <<<"$body" | tail -1)
            [[ "$controller_sha" == "$GITHUB_WORKFLOW_SHA" ]]
          else
            controller_sha=$GITHUB_WORKFLOW_SHA
          fi
          {
            echo "controller_sha=$controller_sha"
            echo "notes_sha256=$(sha256sum "releases/$RELEASE_TAG" | awk '{print $1}')"
          } >>"$GITHUB_OUTPUT"

  native:
    needs: authorize
    if: inputs.action == 'resume'
    uses: ./.github/workflows/build-native-image.yml
    with:
      ref: ${{ inputs.commit_sha }}
      tag: ${{ inputs.tag }}
      notes_sha256: ${{ needs.authorize.outputs.notes_sha256 }}
      upload_artifact: true

  inspect:
    needs: authorize
    if: inputs.action == 'inspect'
    runs-on: ubuntu-latest
    environment: release-publication
    concurrency:
      group: sdk-java-release-publication
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          path: source
          ref: ${{ inputs.commit_sha }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: manual-tools
          ref: ${{ needs.authorize.outputs.controller_sha }}
      - name: Verify immutable manual controller
        run: '[[ "$(git -C manual-tools rev-parse HEAD)" == "${{ needs.authorize.outputs.controller_sha }}" ]]'
      - name: Inspect exact external state without mutation
        working-directory: source
        env:
          EXPECTED_NOTES_SHA256: ${{ needs.authorize.outputs.notes_sha256 }}
          GH_TOKEN: ${{ secrets.RELEASE_PUBLICATION_GITHUB_TOKEN }}
          MANUAL_INSPECTION_FILE: ${{ runner.temp }}/manual-inspection.json
          MANUAL_RELEASE_ACTION: inspect
          RELEASE_COMMIT: ${{ inputs.commit_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
          RH_PASSWORD: ${{ secrets.RH_PASSWORD }}
          RH_USER: ${{ secrets.RH_USER }}
        run: |
          bash "$GITHUB_WORKSPACE/manual-tools/.github/scripts/manual-release.sh"
          {
            echo "## Independent exact-state inspection"
            echo
            echo '```json'
            jq . "$MANUAL_INSPECTION_FILE"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  resume:
    needs: [authorize, native]
    if: inputs.action == 'resume'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release-publication
    permissions:
      contents: write
      issues: write
    concurrency:
      group: sdk-java-release-publication
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          path: source
          ref: ${{ inputs.commit_sha }}
          submodules: recursive
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: manual-tools
          ref: ${{ needs.authorize.outputs.controller_sha }}
      - name: Verify immutable manual controller
        run: '[[ "$(git -C manual-tools rev-parse HEAD)" == "${{ needs.authorize.outputs.controller_sha }}" ]]'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ac396bf1a80af16236baf54bd7330ae21dc6ece5 # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/native
      - name: Construct the fixed seven-asset set
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version=${RELEASE_TAG#v}
          assets="$RUNNER_TEMP/manual-assets"
          stage="$RUNNER_TEMP/manual-stage"
          mkdir -p "$assets" "$stage"
          for platform in linux_amd64_musl linux_amd64 macOS_amd64 macOS_arm64 linux_arm64 windows_amd64; do
            source_dir="$RUNNER_TEMP/native/$platform"
            [[ -d "$source_dir" ]]
            binary=$(find "$source_dir" -maxdepth 1 -type f -name 'temporal-test-server*')
            [[ -n "$binary" && $(wc -l <<<"$binary" | tr -d ' ') == 1 ]]
            root="temporal-test-server_${version}_${platform}"
            mkdir "$stage/$root"
            cp "$binary" "$stage/$root/$(basename "$binary")"
            if [[ $platform == windows_amd64 ]]; then
              touch -t 198001010000 "$stage/$root" "$stage/$root/$(basename "$binary")"
              (cd "$stage" && zip -Xqr "$assets/$root.zip" "$root")
            else
              chmod 0755 "$stage/$root/$(basename "$binary")"
              tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
                -C "$stage" -czf "$assets/$root.tar.gz" "$root"
            fi
            rm -r "$stage/$root"
          done
          (cd "$assets" && sha256sum temporal-test-server_* >SHA256SUMS)
          echo "MANUAL_ASSET_DIR=$assets" >>"$GITHUB_ENV"
      - name: Record independent tag-level ownership
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLICATION_GITHUB_TOKEN }}
          MANUAL_CONTROLLER_SHA: ${{ needs.authorize.outputs.controller_sha }}
          RELEASE_COMMIT: ${{ inputs.commit_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          title="[sdk-java manual release ownership] $RELEASE_TAG"
          body=$(printf '%s\n' \
            '## Independent manual release ownership' '' \
            "- Tag: \`$RELEASE_TAG\`" "- Full SHA: \`$RELEASE_COMMIT\`" \
            "- Controller SHA: \`$MANUAL_CONTROLLER_SHA\`" \
            "- Actor: \`$GITHUB_TRIGGERING_ACTOR\`" "- Actions run: \`$GITHUB_RUN_ID\`" '' \
            'Temporal automation must not mutate this tag while this locked issue remains open.')
          issues=$(gh api --paginate --slurp \
            'repos/temporalio/sdk-java/issues?state=open&per_page=100')
          matches=$(jq -c --arg title "$title" \
            '[.[][] | select((has("pull_request") | not) and .title == $title)]' <<<"$issues")
          [[ $(jq 'length' <<<"$matches") -le 1 ]]
          if [[ $(jq 'length' <<<"$matches") == 0 ]]; then
            issue=$(gh api --method POST repos/temporalio/sdk-java/issues \
              --raw-field title="$title" --raw-field body="$body")
          else
            issue=$(jq -c '.[0]' <<<"$matches")
            existing_body=$(jq -r .body <<<"$issue")
            [[ "$existing_body" == *"- Tag: \`$RELEASE_TAG\`"* &&
              "$existing_body" == *"- Full SHA: \`$RELEASE_COMMIT\`"* &&
              "$existing_body" == *"- Controller SHA: \`$MANUAL_CONTROLLER_SHA\`"* ]]
          fi
          gh api --method PUT \
            "repos/temporalio/sdk-java/issues/$(jq -er .number <<<"$issue")/lock"
          echo "MANUAL_OWNERSHIP_ISSUE=$(jq -er .number <<<"$issue")" >>"$GITHUB_ENV"
      - name: Resume from exact Maven/GitHub external state
        working-directory: source
        env:
          EXPECTED_NOTES_SHA256: ${{ needs.authorize.outputs.notes_sha256 }}
          GH_TOKEN: ${{ secrets.RELEASE_PUBLICATION_GITHUB_TOKEN }}
          JAR_SIGNING_KEY: ${{ secrets.JAR_SIGNING_KEY }}
          JAR_SIGNING_KEY_ID: ${{ secrets.JAR_SIGNING_KEY_ID }}
          JAR_SIGNING_KEY_PASSWORD: ${{ secrets.JAR_SIGNING_KEY_PASSWORD }}
          MANUAL_INSPECTION_FILE: ${{ runner.temp }}/manual-inspection.json
          MANUAL_RELEASE_ACTION: resume
          RELEASE_COMMIT: ${{ inputs.commit_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
          RH_PASSWORD: ${{ secrets.RH_PASSWORD }}
          RH_USER: ${{ secrets.RH_USER }}
        run: bash "$GITHUB_WORKSPACE/manual-tools/.github/scripts/manual-release.sh"

name: Emergency release handoff
run-name: Emergency release ${{ inputs.tag }} at ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag, such as v1.2.3
        required: true
        type: string
      commit_sha:
        description: Exact full 40-character source commit SHA
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  TEMPORAL_ADDRESS: ${{ secrets.TEMPORAL_RELEASE_ADDRESS }}
  TEMPORAL_NAMESPACE: ${{ secrets.TEMPORAL_RELEASE_NAMESPACE }}
  TEMPORAL_API_KEY: ${{ secrets.TEMPORAL_RELEASE_APPROVAL_API_KEY }}
  RELEASE_AUTOMATION_REF: ${{ vars.RELEASE_AUTOMATION_REF }}
  GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}

jobs:
  emergency_release:
    name: Inspect, claim handoff, and resume exact release
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: release-publication
    concurrency:
      group: sdk-java-release-publication
      cancel-in-progress: false
    steps:
      - name: Validate exact inputs and trusted pin
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-RC[0-9]+)?$ ]]
          [[ "$RELEASE_AUTOMATION_REF" =~ ^[0-9a-f]{40}$ ]]
      - name: Checkout trusted release automation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: bootstrap
          ref: ${{ vars.RELEASE_AUTOMATION_REF }}
      - name: Verify trusted checkout
        working-directory: bootstrap
        run: '[[ "$(git rev-parse HEAD)" == "$RELEASE_AUTOMATION_REF" ]]'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "23"
      - uses: gradle/actions/setup-gradle@ac396bf1a80af16236baf54bd7330ae21dc6ece5 # v6
      - name: Inspect exact Temporal state before any mutation
        id: inspect
        working-directory: bootstrap
        run: >-
          ./gradlew -p .github/release-automation run
          --args="inspect ${{ inputs.tag }} ${{ inputs.commit_sha }}"
      - name: Checkout the release's frozen trusted automation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: automation
          ref: ${{ steps.inspect.outputs.automation_commit }}
      - name: Verify frozen Worker checkout
        env:
          FROZEN_AUTOMATION_COMMIT: ${{ steps.inspect.outputs.automation_commit }}
        run: '[[ "$(git -C automation rev-parse HEAD)" == "$FROZEN_AUTOMATION_COMMIT" ]]'
      - name: Show the ownership and immutable identity
        env:
          PHASE: ${{ steps.inspect.outputs.phase }}
          RELEASE_DIGEST: ${{ steps.inspect.outputs.release_digest }}
          NOTES_SHA256: ${{ steps.inspect.outputs.notes_sha256 }}
          MANIFEST_SHA256: ${{ steps.inspect.outputs.manifest_sha256 }}
        run: |
          {
            echo "## Emergency release inspection"
            echo
            echo "- Existing Temporal phase: \`$PHASE\`"
            echo "- Release digest: \`$RELEASE_DIGEST\`"
            echo "- Notes SHA-256: \`$NOTES_SHA256\`"
            echo "- Manifest SHA-256: \`$MANIFEST_SHA256\`"
            echo
            echo "This run will permanently hand this release to the emergency path."
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Export immutable identity for read-only external inspection
        id: inspection_input
        working-directory: automation
        env:
          GH_TOKEN: ${{ secrets.RELEASE_APPROVAL_GITHUB_TOKEN }}
          RELEASE_AUTOMATION_REF: ${{ steps.inspect.outputs.automation_commit }}
        run: >-
          ./gradlew -p .github/release-automation run
          --args="emergency-inspect-export ${{ inputs.tag }} ${{ inputs.commit_sha }}"
      - name: Checkout immutable release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          path: source
          ref: ${{ inputs.commit_sha }}
          submodules: recursive
      - name: Obtain publication artifact-store credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.RELEASE_PUBLICATION_ARTIFACT_ROLE_ARN }}
      - name: Inspect Central, Sonatype, tag, release, and assets without mutation
        id: external_inspection
        working-directory: source
        env:
          EXPECTED_APPROVAL_ACTOR: ${{ github.triggering_actor }}
          EXPECTED_APPROVAL_RUN_ID: ${{ github.run_id }}
          EXPECTED_COMMIT_SHA: ${{ inputs.commit_sha }}
          EXPECTED_MANIFEST_SHA256: ${{ steps.inspection_input.outputs.manifest_sha256 }}
          EXPECTED_NOTES_SHA256: ${{ steps.inspection_input.outputs.notes_sha256 }}
          EXPECTED_RELEASE_DIGEST: ${{ steps.inspection_input.outputs.release_digest }}
          EXPECTED_REPOSITORY: temporalio/sdk-java
          EXPECTED_RUN_ID: ${{ steps.inspection_input.outputs.run_id }}
          EXPECTED_TAG: ${{ inputs.tag }}
          EXPECTED_WORKFLOW_ID: ${{ steps.inspection_input.outputs.workflow_id }}
          GH_TOKEN: ${{ secrets.RELEASE_PUBLICATION_GITHUB_TOKEN }}
          RELEASE_ARTIFACT_BUCKET: ${{ vars.RELEASE_ARTIFACT_BUCKET }}
          RELEASE_INPUT_FILE: ${{ steps.inspection_input.outputs.release_input_file }}
          RELEASE_MODE: emergency-inspect
          RELEASE_OUTPUT_FILE: ${{ runner.temp }}/emergency-inspection.json
          RELEASE_STAGE: inspect
          RH_PASSWORD: ${{ secrets.RH_PASSWORD }}
          RH_USER: ${{ secrets.RH_USER }}
          TRUSTED_AUTOMATION_ROOT: ${{ github.workspace }}/automation
          TRUSTED_WORKER_COMMIT: ${{ steps.inspect.outputs.automation_commit }}
        run: |
          bash "$TRUSTED_AUTOMATION_ROOT/.github/scripts/temporal-release/reconcile-publication.sh"
          {
            echo
            echo "### External state before handoff"
            echo '```json'
            jq . "$RELEASE_OUTPUT_FILE"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Record authenticated durable handoff
        if: steps.inspect.outputs.phase != 'HANDED_OFF'
        working-directory: automation
        env:
          GH_TOKEN: ${{ secrets.RELEASE_APPROVAL_GITHUB_TOKEN }}
          RELEASE_AUTOMATION_REF: ${{ steps.inspect.outputs.automation_commit }}
        run: >-
          ./gradlew -p .github/release-automation run
          --args="control handoff-manual ${{ inputs.tag }} ${{ inputs.commit_sha }}"
      - name: Export the handed-off immutable release
        id: export
        working-directory: automation
        env:
          GH_TOKEN: ${{ secrets.RELEASE_APPROVAL_GITHUB_TOKEN }}
          RELEASE_AUTOMATION_REF: ${{ steps.inspect.outputs.automation_commit }}
        run: >-
          ./gradlew -p .github/release-automation run
          --args="emergency-export ${{ inputs.tag }} ${{ inputs.commit_sha }}"
      - name: Reconcile from the first unfinished irreversible stage
        working-directory: source
        env:
          EXPECTED_APPROVAL_ACTOR: ${{ github.triggering_actor }}
          EXPECTED_APPROVAL_RUN_ID: ${{ github.run_id }}
          EXPECTED_COMMIT_SHA: ${{ inputs.commit_sha }}
          EXPECTED_MANIFEST_SHA256: ${{ steps.export.outputs.manifest_sha256 }}
          EXPECTED_NOTES_SHA256: ${{ steps.export.outputs.notes_sha256 }}
          EXPECTED_RELEASE_DIGEST: ${{ steps.export.outputs.release_digest }}
          EXPECTED_REPOSITORY: temporalio/sdk-java
          EXPECTED_RUN_ID: ${{ steps.export.outputs.run_id }}
          EXPECTED_TAG: ${{ inputs.tag }}
          EXPECTED_WORKFLOW_ID: ${{ steps.export.outputs.workflow_id }}
          GH_TOKEN: ${{ secrets.RELEASE_PUBLICATION_GITHUB_TOKEN }}
          JAR_SIGNING_KEY: ${{ secrets.JAR_SIGNING_KEY }}
          JAR_SIGNING_KEY_ID: ${{ secrets.JAR_SIGNING_KEY_ID }}
          JAR_SIGNING_KEY_PASSWORD: ${{ secrets.JAR_SIGNING_KEY_PASSWORD }}
          RELEASE_ARTIFACT_BUCKET: ${{ vars.RELEASE_ARTIFACT_BUCKET }}
          RELEASE_INPUT_FILE: ${{ steps.export.outputs.release_input_file }}
          RELEASE_MODE: emergency
          RH_PASSWORD: ${{ secrets.RH_PASSWORD }}
          RH_USER: ${{ secrets.RH_USER }}
          TRUSTED_AUTOMATION_ROOT: ${{ github.workspace }}/automation
          TRUSTED_WORKER_COMMIT: ${{ steps.inspect.outputs.automation_commit }}
        run: |
          output="$RUNNER_TEMP/emergency-release-output.json"
          export RELEASE_OUTPUT_FILE=$output
          for stage in preflight maven github-draft github-publish; do
            export RELEASE_STAGE=$stage
            bash "$TRUSTED_AUTOMATION_ROOT/.github/scripts/temporal-release/reconcile-publication.sh"
          done

name: Temporal emergency release control
run-name: Emergency ${{ inputs.action }} for ${{ inputs.tag }} at ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Fixed emergency release operation
        required: true
        type: choice
        options:
          - build-artifacts
          - replace-artifacts
          - inspect
          - handoff-and-publish
          - authorize-maven-retry
      tag:
        description: Exact release tag, such as v1.2.3
        required: true
        type: string
      commit_sha:
        description: Exact full 40-character source commit SHA
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  EMERGENCY_ACTION: ${{ inputs.action }}
  RELEASE_COMMIT: ${{ inputs.commit_sha }}
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_AUTOMATION_REF: ${{ vars.RELEASE_AUTOMATION_REF }}
  RELEASE_AUTOMATION_COMPATIBLE_REFS: ${{ vars.RELEASE_AUTOMATION_COMPATIBLE_REFS }}
  GITHUB_TRIGGERING_ACTOR: ${{ github.actor }}

jobs:
  control:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release-publication
    steps:
      - name: Validate exact inputs and trusted pin
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-RC[0-9]+)?$ ]]
          [[ "$RELEASE_AUTOMATION_REF" =~ ^[0-9a-f]{40}$ ]]
      - name: Obtain durable candidate-state credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.RELEASE_PUBLICATION_ARTIFACT_ROLE_ARN }}
      - name: Resolve the candidate's frozen automation version
        id: frozen
        env:
          RELEASE_ARTIFACT_BUCKET: ${{ vars.RELEASE_ARTIFACT_BUCKET }}
          RELEASE_COMMIT: ${{ inputs.commit_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          s3_exists() {
            local object_key=$1 error="$RUNNER_TEMP/s3-head-error.txt" status
            set +e
            aws s3api head-object --bucket "$RELEASE_ARTIFACT_BUCKET" --key "$object_key" \
              >"$RUNNER_TEMP/s3-head.json" 2>"$error"
            status=$?
            set -e
            [[ $status -eq 0 ]] && return 0
            if [[ $status -eq 254 ]] &&
              grep -Eq '^An error occurred \((404|NoSuchKey|NotFound)\) when calling the HeadObject operation:' \
                "$error"; then
              return 1
            fi
            cat "$error" >&2
            exit 1
          }
          request_key="sdk-java/emergency/$RELEASE_TAG.json"
          candidate_key="sdk-java/candidates/$RELEASE_TAG.json"
          automation_commit=$RELEASE_AUTOMATION_REF
          if s3_exists "$request_key"; then
            aws s3 cp "s3://$RELEASE_ARTIFACT_BUCKET/$request_key" \
              "$RUNNER_TEMP/frozen-request.json" --no-progress >/dev/null
            jq -e --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" \
              '.candidate.repository == "temporalio/sdk-java" and
               .candidate.tag == $tag and .candidate.commitSha == $commit and
               (.candidate.trustedAutomationCommit | test("^[0-9a-f]{40}$"))' \
              "$RUNNER_TEMP/frozen-request.json" >/dev/null
            automation_commit=$(jq -er .candidate.trustedAutomationCommit \
              "$RUNNER_TEMP/frozen-request.json")
            [[ ",$RELEASE_AUTOMATION_REF,$RELEASE_AUTOMATION_COMPATIBLE_REFS," ==
              *",$automation_commit,"* ]]
          elif s3_exists "$candidate_key"; then
            aws s3 cp "s3://$RELEASE_ARTIFACT_BUCKET/$candidate_key" \
              "$RUNNER_TEMP/frozen-candidate.json" --no-progress >/dev/null
            jq -e --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" \
              '.repository == "temporalio/sdk-java" and .tag == $tag and
               .commitSha == $commit and
               (.trustedAutomationCommit | test("^[0-9a-f]{40}$"))' \
              "$RUNNER_TEMP/frozen-candidate.json" >/dev/null
            automation_commit=$(jq -er .trustedAutomationCommit \
              "$RUNNER_TEMP/frozen-candidate.json")
            [[ ",$RELEASE_AUTOMATION_REF,$RELEASE_AUTOMATION_COMPATIBLE_REFS," ==
              *",$automation_commit,"* ]]
          fi
          echo "automation_commit=$automation_commit" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: automation
          ref: ${{ steps.frozen.outputs.automation_commit }}
      - name: Verify frozen automation checkout
        env:
          FROZEN_AUTOMATION_COMMIT: ${{ steps.frozen.outputs.automation_commit }}
        run: '[[ "$(git -C automation rev-parse HEAD)" == "$FROZEN_AUTOMATION_COMMIT" ]]'
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
          submodules: recursive
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ac396bf1a80af16236baf54bd7330ae21dc6ece5 # v6
      - name: Verify active release manager
        env:
          GH_TOKEN: ${{ secrets.RELEASE_APPROVAL_GITHUB_TOKEN }}
        run: automation/.github/scripts/temporal-release/verify-approver.sh "$GITHUB_TRIGGERING_ACTOR"
      - name: Resolve immutable emergency candidate
        id: candidate
        working-directory: source
        env:
          RELEASE_COMMIT: ${{ inputs.commit_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_AUTOMATION_REF: ${{ steps.frozen.outputs.automation_commit }}
          TRUSTED_AUTOMATION_ROOT: ${{ github.workspace }}/automation
        run: |
          ../automation/.github/scripts/temporal-release/resolve-emergency-candidate.sh
          candidate_file=$(awk -F= '$1 == "candidate_file" {print $2}' "$GITHUB_OUTPUT" | tail -1)
          cd ../automation
          ./gradlew -p .github/release-automation run --args="candidate-outputs $candidate_file"
      - name: Obtain durable artifact-state credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.RELEASE_PUBLICATION_ARTIFACT_ROLE_ARN }}
      - name: Create or validate durable emergency request
        id: request
        env:
          ACTION: ${{ inputs.action }}
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.candidate_digest }}
          CANDIDATE_FILE: ${{ steps.candidate.outputs.candidate_file }}
          GH_TOKEN: ${{ secrets.RELEASE_PUBLICATION_GITHUB_TOKEN }}
          RELEASE_ARTIFACT_BUCKET: ${{ vars.RELEASE_ARTIFACT_BUCKET }}
          RELEASE_TAG: ${{ inputs.tag }}
          RH_PASSWORD: ${{ secrets.RH_PASSWORD }}
          RH_USER: ${{ secrets.RH_USER }}
        run: |
          s3_exists() {
            local object_key=$1 output=$2 error="$RUNNER_TEMP/s3-head-error.txt" status
            set +e
            aws s3api head-object --bucket "$RELEASE_ARTIFACT_BUCKET" --key "$object_key" \
              >"$output" 2>"$error"
            status=$?
            set -e
            [[ $status -eq 0 ]] && return 0
            if [[ $status -eq 254 ]] &&
              grep -Eq '^An error occurred \((404|NoSuchKey|NotFound)\) when calling the HeadObject operation:' \
                "$error"; then
              return 1
            fi
            cat "$error" >&2
            exit 1
          }
          key="sdk-java/emergency/$RELEASE_TAG.json"
          request="$RUNNER_TEMP/emergency-request.json"
          existing="$RUNNER_TEMP/existing-emergency-request.json"
          if s3_exists "$key" "$RUNNER_TEMP/emergency-request-head.json"; then
            aws s3 cp "s3://$RELEASE_ARTIFACT_BUCKET/$key" "$existing" --no-progress >/dev/null
            jq -e --slurpfile candidate "$CANDIDATE_FILE" --arg digest "$CANDIDATE_DIGEST" \
              '.candidate == $candidate[0] and .candidateDigest == $digest and
               ((.artifactPrefix == ("sdk-java/" + $digest + "/") and
                 .replacementAttempt == "") or
                ((.replacementAttempt | test("^[0-9a-f]{64}$")) and
                 .artifactPrefix == ("sdk-java/emergency-artifacts/" + $digest +
                   "/" + .replacementAttempt + "/"))) and
               (.state == "BUILDING" or .state == "AWAITING_INSPECTION" or
                .state == "INSPECTED" or .state == "READY" or .state == "COMPLETE" or
                .state == "BLOCKED")' "$existing" >/dev/null
            cp "$existing" "$request"
            request_etag=$(jq -er .ETag "$RUNNER_TEMP/emergency-request-head.json")
            if [[ "$ACTION" == replace-artifacts ]]; then
              state=$(jq -er .state "$request")
              [[ "$state" == BLOCKED || "$state" == AWAITING_INSPECTION ||
                "$state" == INSPECTED ]] || {
                echo "Artifact replacement is unavailable from state $state." >&2
                exit 1
              }
              automation/.github/scripts/temporal-release/verify-artifact-replacement-safe.sh
              replacement_generation=$(( $(jq -r '.replacementGeneration // 0' "$request") + 1 ))
              replacement_attempt=$(printf '%s' \
                "$CANDIDATE_DIGEST:emergency-replacement:$replacement_generation" |
                sha256sum | awk '{print $1}')
              artifact_prefix="sdk-java/emergency-artifacts/$CANDIDATE_DIGEST/$replacement_attempt/"
              jq --arg prefix "$artifact_prefix" --arg attempt "$replacement_attempt" \
                --arg actor "$GITHUB_TRIGGERING_ACTOR" --argjson run "$GITHUB_RUN_ID" \
                --arg recordedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
                --argjson generation "$replacement_generation" \
                '.state="BUILDING" | .artifactPrefix=$prefix |
                 .replacementAttempt=$attempt | .replacementGeneration=$generation |
                 .approvedBy=(.approvedBy // $actor) |
                 .approvalRunId=(.approvalRunId // $run) |
                 .handoff=(.handoff // {actor:$actor,tag:.candidate.tag,
                   commitSha:.candidate.commitSha,
                   reason:"Release manager transferred ownership to emergency automation.",
                   recordedAt:$recordedAt,githubRunId:$run}) |
                 del(.manifestSha256,.inspection,.blockedReason,.blockedStage,
                   .blockedAt,.blockedError)' "$request" >"$RUNNER_TEMP/replacement-request.json"
              aws s3api put-object --bucket "$RELEASE_ARTIFACT_BUCKET" --key "$key" \
                --body "$RUNNER_TEMP/replacement-request.json" --if-match "$request_etag" >/dev/null
              cp "$RUNNER_TEMP/replacement-request.json" "$request"
              request_etag=$(aws s3api head-object --bucket "$RELEASE_ARTIFACT_BUCKET" \
                --key "$key" | jq -er .ETag)
            fi
          else
            [[ "$ACTION" == build-artifacts ]] || {
              echo "Run build-artifacts first to create the durable emergency request." >&2
              exit 1
            }
            normal_prefix="sdk-java/$CANDIDATE_DIGEST/"
            normal_count=$(aws s3api list-objects-v2 --bucket "$RELEASE_ARTIFACT_BUCKET" \
              --prefix "$normal_prefix" --output json | jq '.Contents // [] | length')
            normal_valid=false
            if [[ $normal_count -eq 6 ]]; then
              if RELEASE_ARTIFACT_PREFIX=$normal_prefix \
                RELEASE_CANDIDATE_DIGEST=$CANDIDATE_DIGEST \
                RELEASE_MANIFEST_FILE="$RUNNER_TEMP/normal-manifest.tsv" \
                automation/.github/scripts/temporal-release/collect-artifact-manifest.sh; then
                normal_valid=true
              fi
            fi
            if [[ $normal_valid == true ]]; then
              artifact_prefix=$normal_prefix
              replacement_attempt=""
              replacement_generation=0
            else
              automation/.github/scripts/temporal-release/verify-artifact-replacement-safe.sh
              replacement_generation=1
              replacement_attempt=$(printf '%s' \
                "$CANDIDATE_DIGEST:emergency-replacement:$replacement_generation" | \
                sha256sum | awk '{print $1}')
              artifact_prefix="sdk-java/emergency-artifacts/$CANDIDATE_DIGEST/$replacement_attempt/"
            fi
            jq -n --slurpfile candidate "$CANDIDATE_FILE" --arg digest "$CANDIDATE_DIGEST" \
              --arg actor "$GITHUB_TRIGGERING_ACTOR" --argjson runId "$GITHUB_RUN_ID" \
              --arg artifactPrefix "$artifact_prefix" \
              --arg replacementAttempt "$replacement_attempt" \
              --argjson replacement_generation "$replacement_generation" \
              '{candidate:$candidate[0],candidateDigest:$digest,state:"BUILDING",
                requestedBy:$actor,requestedRunId:$runId,mavenSubmissionGeneration:0,
                artifactPrefix:$artifactPrefix,replacementAttempt:$replacementAttempt,
                replacementGeneration:$replacement_generation}' >"$request"
            aws s3api put-object --bucket "$RELEASE_ARTIFACT_BUCKET" --key "$key" \
              --body "$request" --if-none-match '*' >/dev/null
          fi
          {
            echo "key=$key"
            echo "request=$request"
            echo "state=$(jq -er .state "$request")"
            echo "generation=$(jq -er .mavenSubmissionGeneration "$request")"
            echo "artifact_prefix=$(jq -er .artifactPrefix "$request")"
            echo "replacement_attempt=$(jq -r .replacementAttempt "$request")"
            echo "maven_retry_actor=$(jq -r '.mavenRetryAuthorizationActor // ""' "$request")"
            echo "maven_retry_run_id=$(jq -r '.mavenRetryAuthorizationRunId // ""' "$request")"
            echo "maven_retry_sha256=$(jq -r '.mavenRetryAuthorizationSha256 // ""' "$request")"
            echo "etag=${request_etag:-}"
          } >>"$GITHUB_OUTPUT"
      - name: Collect the exact durable artifact manifest
        if: inputs.action == 'inspect' || inputs.action == 'handoff-and-publish' || inputs.action == 'authorize-maven-retry'
        id: manifest
        env:
          RELEASE_ARTIFACT_BUCKET: ${{ vars.RELEASE_ARTIFACT_BUCKET }}
          RELEASE_ARTIFACT_PREFIX: ${{ steps.request.outputs.artifact_prefix }}
          RELEASE_CANDIDATE_DIGEST: ${{ steps.candidate.outputs.candidate_digest }}
          RELEASE_MANIFEST_FILE: ${{ runner.temp }}/emergency-manifest.tsv
        run: automation/.github/scripts/temporal-release/collect-artifact-manifest.sh
      - name: Construct independently durable release identity
        if: inputs.action == 'inspect' || inputs.action == 'handoff-and-publish' || inputs.action == 'authorize-maven-retry'
        id: identity
        working-directory: automation
        env:
          EMERGENCY_APPROVAL_ACTOR: ${{ github.actor }}
          EMERGENCY_APPROVAL_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.RELEASE_APPROVAL_GITHUB_TOKEN }}
          MAVEN_SUBMISSION_GENERATION: ${{ steps.request.outputs.generation }}
          MAVEN_RETRY_AUTHORIZATION_ACTOR: ${{ steps.request.outputs.maven_retry_actor }}
          MAVEN_RETRY_AUTHORIZATION_RUN_ID: ${{ steps.request.outputs.maven_retry_run_id }}
          MAVEN_RETRY_AUTHORIZATION_SHA256: ${{ steps.request.outputs.maven_retry_sha256 }}
        run: >-
          ./gradlew -p .github/release-automation run
          --args="emergency-input ${{ steps.candidate.outputs.candidate_file }} ${{ runner.temp }}/emergency-manifest.tsv"
      - name: Inspect Central, Sonatype, tag, release, and assets without publication mutation
        if: inputs.action == 'inspect' || inputs.action == 'handoff-and-publish' || inputs.action == 'authorize-maven-retry'
        working-directory: source
        env:
          EXPECTED_APPROVAL_ACTOR: ${{ github.actor }}
          EXPECTED_APPROVAL_RUN_ID: ${{ github.run_id }}
          EXPECTED_COMMIT_SHA: ${{ inputs.commit_sha }}
          EXPECTED_MANIFEST_SHA256: ${{ steps.identity.outputs.manifest_sha256 }}
          EXPECTED_MAVEN_SUBMISSION_GENERATION: ${{ steps.request.outputs.generation }}
          EXPECTED_NOTES_SHA256: ${{ steps.identity.outputs.notes_sha256 }}
          EXPECTED_RELEASE_DIGEST: ${{ steps.identity.outputs.release_digest }}
          EXPECTED_REPOSITORY: temporalio/sdk-java
          EXPECTED_RUN_ID: ${{ steps.identity.outputs.run_id }}
          EXPECTED_TAG: ${{ inputs.tag }}
          EXPECTED_WORKFLOW_ID: ${{ steps.identity.outputs.workflow_id }}
          GH_TOKEN: ${{ secrets.RELEASE_PUBLICATION_GITHUB_TOKEN }}
          RELEASE_ARTIFACT_BUCKET: ${{ vars.RELEASE_ARTIFACT_BUCKET }}
          RELEASE_INPUT_FILE: ${{ steps.identity.outputs.release_input_file }}
          RELEASE_MODE: emergency-inspect
          RELEASE_OUTPUT_FILE: ${{ runner.temp }}/emergency-inspection.json
          RELEASE_STAGE: inspect
          RH_PASSWORD: ${{ secrets.RH_PASSWORD }}
          RH_USER: ${{ secrets.RH_USER }}
          TRUSTED_AUTOMATION_ROOT: ${{ github.workspace }}/automation
          TRUSTED_WORKER_COMMIT: ${{ steps.frozen.outputs.automation_commit }}
        run: |
          bash "$TRUSTED_AUTOMATION_ROOT/.github/scripts/temporal-release/reconcile-publication.sh"
          {
            echo "## Exact emergency release inspection"
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Full SHA: \`$RELEASE_COMMIT\`"
            echo "- Release digest: \`${{ steps.identity.outputs.release_digest }}\`"
            echo "- Manifest SHA-256: \`${{ steps.identity.outputs.manifest_sha256 }}\`"
            echo
            echo '```json'
            jq . "$RELEASE_OUTPUT_FILE"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Record completed inspection or authorize publication
        if: inputs.action == 'inspect' || inputs.action == 'handoff-and-publish'
        env:
          ACTION: ${{ inputs.action }}
          INSPECTION_FILE: ${{ runner.temp }}/emergency-inspection.json
          MANIFEST_SHA256: ${{ steps.identity.outputs.manifest_sha256 }}
          RELEASE_ARTIFACT_BUCKET: ${{ vars.RELEASE_ARTIFACT_BUCKET }}
          REQUEST_FILE: ${{ steps.request.outputs.request }}
          REQUEST_KEY: ${{ steps.request.outputs.key }}
        run: |
          if [[ "$ACTION" == inspect ]]; then
            current_state=$(jq -r .state "$REQUEST_FILE")
            [[ "$current_state" == AWAITING_INSPECTION || "$current_state" == INSPECTED ||
              "$current_state" == BLOCKED ]] || {
              echo "Inspection is not available from state $current_state." >&2
              exit 1
            }
            [[ "$current_state" == BLOCKED ]] && state=BLOCKED || state=INSPECTED
          else
            current_state=$(jq -r .state "$REQUEST_FILE")
            same_manifest=$(jq -r .manifestSha256 "$REQUEST_FILE")
            resumable=false
            if [[ "$current_state" == BLOCKED ]]; then
              blocked_reason=$(jq -r '.blockedReason // ""' "$REQUEST_FILE")
              [[ "$blocked_reason" != InvalidArtifacts &&
                "$blocked_reason" != MavenSubmissionAmbiguous &&
                "$blocked_reason" != MavenDeploymentFailed ]] && resumable=true
            fi
            [[ "$same_manifest" == "$MANIFEST_SHA256" &&
              ( "$current_state" == INSPECTED || "$resumable" == true ) ]] || {
              echo "Run inspect for this exact manifest before handoff-and-publish." >&2
              exit 1
            }
            state=READY
          fi
          jq --arg state "$state" --arg manifest "$MANIFEST_SHA256" \
            --arg actor "$GITHUB_TRIGGERING_ACTOR" --argjson run "$GITHUB_RUN_ID" \
            --arg action "$ACTION" --arg recordedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --slurpfile inspection "$INSPECTION_FILE" \
            '.state=$state | .manifestSha256=$manifest |
             .inspection=$inspection[0] | .inspectionRunId=$run |
             .mavenSubmissionGeneration=$inspection[0].mavenSubmissionGeneration |
             if $action == "handoff-and-publish" then
               .approvedBy=$actor |
               .approvalRunId=$run |
               .handoff={actor:$actor,tag:.candidate.tag,
                 commitSha:.candidate.commitSha,
                 reason:"Release manager transferred ownership to emergency automation.",
                 recordedAt:$recordedAt,githubRunId:$run}
             else . end' \
            "$REQUEST_FILE" >"$RUNNER_TEMP/updated-request.json"
          aws s3api put-object --bucket "$RELEASE_ARTIFACT_BUCKET" --key "$REQUEST_KEY" \
            --body "$RUNNER_TEMP/updated-request.json" --if-match '${{ steps.request.outputs.etag }}' \
            >/dev/null
      - name: Authorize one new Maven staging generation after manual Sonatype inspection
        if: inputs.action == 'authorize-maven-retry'
        env:
          RELEASE_ARTIFACT_BUCKET: ${{ vars.RELEASE_ARTIFACT_BUCKET }}
          REQUEST_FILE: ${{ steps.request.outputs.request }}
          REQUEST_KEY: ${{ steps.request.outputs.key }}
        run: |
          [[ $(jq -r .state "$REQUEST_FILE") == BLOCKED &&
            ( $(jq -r .blockedReason "$REQUEST_FILE") == MavenSubmissionAmbiguous ||
              $(jq -r .blockedReason "$REQUEST_FILE") == MavenDeploymentFailed ) &&
            $(jq -r '.mavenPresent' "$RUNNER_TEMP/emergency-inspection.json") == 0 ]] || {
            echo "The emergency release is not blocked on an ambiguous Maven intent." >&2
            exit 1
          }
          current_generation=$(jq -r .mavenSubmissionGeneration \
            "$RUNNER_TEMP/emergency-inspection.json")
          current=$(jq -c --argjson generation "$current_generation" \
            '.mavenGenerations[]? | select(.generation == $generation)' \
            "$RUNNER_TEMP/emergency-inspection.json")
          if [[ -n "$current" ]]; then
            repository_state=$(jq -r .repositoryState <<<"$current")
            portal_state=$(jq -r .portalDeploymentState <<<"$current")
            [[ ( "$repository_state" == absent || "$repository_state" == unavailable ) &&
              ( -z "$portal_state" || "$portal_state" == FAILED ) ]] || {
              echo "The exact prior repository/deployment still exists; it must be reconciled." >&2
              exit 1
            }
          fi
          generation=$((current_generation + 1))
          authorization="$RUNNER_TEMP/emergency-maven-retry-authorization.json"
          jq -cn --arg repository temporalio/sdk-java \
            --arg tag "$RELEASE_TAG" --arg commitSha "$RELEASE_COMMIT" \
            --arg releaseDigest '${{ steps.identity.outputs.release_digest }}' \
            --arg workflowId '${{ steps.identity.outputs.workflow_id }}' \
            --arg runId '${{ steps.identity.outputs.run_id }}' \
            --arg githubActor "$GITHUB_TRIGGERING_ACTOR" --argjson githubRunId "$GITHUB_RUN_ID" \
            --argjson authorizedGeneration "$generation" \
            '{repository:$repository,tag:$tag,commitSha:$commitSha,
              releaseDigest:$releaseDigest,workflowId:$workflowId,runId:$runId,
              githubActor:$githubActor,githubRunId:$githubRunId,
              authorizedGeneration:$authorizedGeneration,freshInspection:true}' >"$authorization"
          authorization_key="sdk-java/${{ steps.identity.outputs.release_digest }}/state/maven/retry-authorizations/$generation.json"
          if ! aws s3api put-object --bucket "$RELEASE_ARTIFACT_BUCKET" \
            --key "$authorization_key" --body "$authorization" --if-none-match '*' \
            >/dev/null 2>&1; then
            aws s3 cp "s3://$RELEASE_ARTIFACT_BUCKET/$authorization_key" \
              "$RUNNER_TEMP/existing-emergency-authorization.json" --no-progress >/dev/null
            jq -e --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" \
              --arg digest '${{ steps.identity.outputs.release_digest }}' \
              --argjson generation "$generation" \
              '.repository == "temporalio/sdk-java" and .tag == $tag and
               .commitSha == $commit and .releaseDigest == $digest and
               .authorizedGeneration == $generation and .freshInspection == true' \
              "$RUNNER_TEMP/existing-emergency-authorization.json" >/dev/null
            cp "$RUNNER_TEMP/existing-emergency-authorization.json" "$authorization"
          fi
          authorization_sha256=$(sha256sum "$authorization" | awk '{print $1}')
          authorization_actor=$(jq -er .githubActor "$authorization")
          authorization_run=$(jq -er .githubRunId "$authorization")
          jq --arg actor "$GITHUB_TRIGGERING_ACTOR" --argjson run "$GITHUB_RUN_ID" \
            --arg authorizationActor "$authorization_actor" \
            --argjson authorizationRun "$authorization_run" \
            --arg authorizationSha256 "$authorization_sha256" \
            --argjson generation "$generation" \
            --arg recordedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '.state="READY" | .mavenSubmissionGeneration=$generation |
             .mavenRetryAuthorizedBy=$actor | .mavenRetryAuthorizationRunId=$run |
             .mavenRetryAuthorizationActor=$authorizationActor |
             .mavenRetryAuthorizationRunId=$authorizationRun |
             .mavenRetryAuthorizationSha256=$authorizationSha256 |
             .approvedBy=$actor | .approvalRunId=$run |
             .handoff={actor:$actor,tag:.candidate.tag,commitSha:.candidate.commitSha,
               reason:"Release manager transferred ownership to emergency automation.",
               recordedAt:$recordedAt,githubRunId:$run} | del(.blockedReason)' \
            "$REQUEST_FILE" >"$RUNNER_TEMP/updated-request.json"
          aws s3api put-object --bucket "$RELEASE_ARTIFACT_BUCKET" --key "$REQUEST_KEY" \
            --body "$RUNNER_TEMP/updated-request.json" --if-match '${{ steps.request.outputs.etag }}' \
            >/dev/null

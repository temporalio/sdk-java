name: Recover dispatch-only release fallback

on:
  workflow_run:
    workflows:
      - Independent manual release fallback
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  retry_interrupted_fallback:
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'cancelled') &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.run_attempt < 6
    runs-on: ubuntu-latest
    steps:
      - name: Retry only the authenticated fallback run
        env:
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -e '.workflow_run.name == "Independent manual release fallback" and
            .workflow_run.event == "workflow_dispatch" and
            .workflow_run.head_repository.full_name == "temporalio/sdk-java" and
            (.workflow_run.head_sha | test("^[0-9a-f]{40}$"))' "$GITHUB_EVENT_PATH" >/dev/null
          conclusion=$(jq -er .workflow_run.conclusion "$GITHUB_EVENT_PATH")
          endpoint=rerun-failed-jobs
          [[ "$conclusion" == cancelled ]] && endpoint=rerun
          gh api --method POST \
            "repos/temporalio/sdk-java/actions/runs/$FAILED_RUN_ID/$endpoint"

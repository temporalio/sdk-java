name: Temporal release automation CI

on:
  pull_request:
    paths:
      - ".github/release-automation/**"
      - ".github/scripts/temporal-release/**"
      - ".github/workflows/temporal-release-*.yml"
      - ".github/workflows/build-native-image.yml"
      - "gradle/publishing.gradle"
      - "gradle/versioning.gradle"
  push:
    branches:
      - main
    paths:
      - ".github/release-automation/**"
      - ".github/scripts/temporal-release/**"
      - ".github/workflows/temporal-release-*.yml"
      - ".github/workflows/build-native-image.yml"
      - "gradle/publishing.gradle"
      - "gradle/versioning.gradle"

permissions:
  contents: read

jobs:
  local_only:
    name: Format, compile, and run local tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
      - uses: ./.github/release-automation/setup
      - name: Check shell syntax
        run: |
          for script in .github/scripts/temporal-release/*.sh \
            .github/release-automation/docker/native-image-musl-java23/install-musl.sh; do
            bash -n "$script"
          done
      - name: Test exact GitHub artifact handling
        run: |
          .github/scripts/temporal-release/test-github-artifacts.sh
          .github/scripts/temporal-release/test-native-packaging.sh
      - name: Parse workflow YAML
        run: >-
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each {
          |workflow| YAML.parse_file(workflow) }'
      - name: Verify formatting and local tests
        run: |
          uv run --directory .github/release-automation --frozen ruff format --check release_automation tests
          uv run --directory .github/release-automation --frozen ruff check release_automation tests
          uv run --directory .github/release-automation --frozen mypy --package release_automation
          uv run --directory .github/release-automation --frozen pytest -q

name: Control Temporal-backed release
run-name: ${{ inputs.action }} ${{ inputs.tag }} at ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Authenticated control operation
        required: true
        type: choice
        options:
          - inspect
          - pause
          - resume
          - handoff-manual
          - retry-maven-submission
      tag:
        description: Exact release tag
        required: true
        type: string
      commit_sha:
        description: Exact full 40-character release commit SHA
        required: true
        type: string

permissions:
  contents: read

env:
  CONTROL_ACTION: ${{ inputs.action }}
  RELEASE_COMMIT: ${{ inputs.commit_sha }}
  RELEASE_TAG: ${{ inputs.tag }}
  TEMPORAL_ADDRESS: ${{ secrets.TEMPORAL_RELEASE_ADDRESS }}
  TEMPORAL_NAMESPACE: ${{ secrets.TEMPORAL_RELEASE_NAMESPACE }}
  TEMPORAL_API_KEY: ${{ secrets.TEMPORAL_RELEASE_APPROVAL_API_KEY }}
  RELEASE_AUTOMATION_REF: ${{ vars.RELEASE_AUTOMATION_REF }}
  RELEASE_AUTOMATION_COMPATIBLE_REFS: ${{ vars.RELEASE_AUTOMATION_COMPATIBLE_REFS }}
  GITHUB_TRIGGERING_ACTOR: ${{ github.actor }}

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-control
    outputs:
      automation_commit: ${{ steps.target.outputs.automation_commit }}
      phase: ${{ steps.target.outputs.phase }}
      release_digest: ${{ steps.target.outputs.release_digest }}
    steps:
      - name: Validate exact inputs and trusted automation pin
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_AUTOMATION_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-RC[0-9]+)?$ ]]
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: bootstrap
          ref: ${{ vars.RELEASE_AUTOMATION_REF }}
      - name: Verify bootstrap checkout
        run: '[[ "$(git -C bootstrap rev-parse HEAD)" == "$RELEASE_AUTOMATION_REF" ]]'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ac396bf1a80af16236baf54bd7330ae21dc6ece5 # v6
      - name: Resolve the release's frozen Worker version
        id: target
        working-directory: bootstrap
        run: >-
          ./gradlew -p .github/release-automation run
          --args="inspect $RELEASE_TAG $RELEASE_COMMIT"
      - name: Enforce the protected Worker allowlist
        env:
          FROZEN_AUTOMATION_COMMIT: ${{ steps.target.outputs.automation_commit }}
        run: |
          [[ "$FROZEN_AUTOMATION_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          while IFS= read -r compatible; do
            [[ -z "$compatible" || "$compatible" =~ ^[0-9a-f]{40}$ ]]
          done < <(tr ',' '\n' <<<"$RELEASE_AUTOMATION_COMPATIBLE_REFS")
          [[ ",$RELEASE_AUTOMATION_REF,$RELEASE_AUTOMATION_COMPATIBLE_REFS," ==
            *",$FROZEN_AUTOMATION_COMMIT,"* ]]
      - name: Summarize durable state
        env:
          PHASE: ${{ steps.target.outputs.phase }}
          RELEASE_DIGEST: ${{ steps.target.outputs.release_digest }}
          LAST_ERROR: ${{ steps.target.outputs.last_error }}
          SONATYPE_REPOSITORY_ID: ${{ steps.target.outputs.sonatype_repository_id }}
          PORTAL_DEPLOYMENT_ID: ${{ steps.target.outputs.portal_deployment_id }}
        run: |
          {
            echo "## Durable release state"
            echo
            echo "- Phase: \`$PHASE\`"
            echo "- Release digest: \`$RELEASE_DIGEST\`"
            echo "- Last error: \`${LAST_ERROR:-none}\`"
            echo "- Sonatype repository: \`${SONATYPE_REPOSITORY_ID:-none}\`"
            echo "- Portal deployment: \`${PORTAL_DEPLOYMENT_ID:-none}\`"
          } >>"$GITHUB_STEP_SUMMARY"

  control:
    needs: resolve
    if: inputs.action != 'inspect' && inputs.action != 'retry-maven-submission'
    runs-on: ubuntu-latest
    environment: release-control
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.automation_commit }}
      - name: Verify frozen Worker checkout
        env:
          FROZEN_AUTOMATION_COMMIT: ${{ needs.resolve.outputs.automation_commit }}
          IDENTITY_AUTOMATION_COMMIT: ${{ needs.resolve.outputs.automation_commit }}
        run: '[[ "$IDENTITY_AUTOMATION_COMMIT" == "$FROZEN_AUTOMATION_COMMIT" && "$(git rev-parse HEAD)" == "$FROZEN_AUTOMATION_COMMIT" ]]'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ac396bf1a80af16236baf54bd7330ae21dc6ece5 # v6
      - name: Submit authenticated release-specific Update
        env:
          GH_TOKEN: ${{ secrets.RELEASE_APPROVAL_GITHUB_TOKEN }}
          RELEASE_AUTOMATION_REF: ${{ needs.resolve.outputs.automation_commit }}
        run: >-
          ./gradlew -p .github/release-automation run
          --args="control $CONTROL_ACTION $RELEASE_TAG $RELEASE_COMMIT"

  authorize_maven_retry:
    needs: resolve
    if: inputs.action == 'retry-maven-submission'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release-publication
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
          submodules: recursive
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: automation
          ref: ${{ needs.resolve.outputs.automation_commit }}
      - name: Verify frozen Worker checkout
        env:
          FROZEN_AUTOMATION_COMMIT: ${{ needs.resolve.outputs.automation_commit }}
          IDENTITY_AUTOMATION_COMMIT: ${{ needs.resolve.outputs.automation_commit }}
        run: '[[ "$IDENTITY_AUTOMATION_COMMIT" == "$FROZEN_AUTOMATION_COMMIT" && "$(git -C automation rev-parse HEAD)" == "$FROZEN_AUTOMATION_COMMIT" ]]'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ac396bf1a80af16236baf54bd7330ae21dc6ece5 # v6
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.RELEASE_PUBLICATION_ARTIFACT_ROLE_ARN }}
      - name: Authenticate the retry author before creating durable evidence
        env:
          GH_TOKEN: ${{ secrets.RELEASE_APPROVAL_GITHUB_TOKEN }}
        run: automation/.github/scripts/temporal-release/verify-approver.sh "$GITHUB_TRIGGERING_ACTOR"
      - name: Export the exact approved publication input
        id: input
        working-directory: automation
        run: >-
          ./gradlew -p .github/release-automation run
          --args="publication-input $RELEASE_TAG $RELEASE_COMMIT $RUNNER_TEMP/publication-input.json"
      - name: Perform a fresh exact external inspection
        working-directory: source
        env:
          EXPECTED_APPROVAL_ACTOR: ${{ steps.input.outputs.approval_actor }}
          EXPECTED_APPROVAL_ISSUE_NUMBER: ${{ steps.input.outputs.approval_issue_number }}
          EXPECTED_APPROVAL_ISSUE_NODE_ID: ${{ steps.input.outputs.approval_issue_node_id }}
          EXPECTED_APPROVAL_ISSUE_BODY_SHA256: ${{ steps.input.outputs.approval_issue_body_sha256 }}
          EXPECTED_APPROVAL_RUN_ID: ${{ steps.input.outputs.approval_run_id }}
          EXPECTED_COMMIT_SHA: ${{ inputs.commit_sha }}
          EXPECTED_MANIFEST_SHA256: ${{ steps.input.outputs.manifest_sha256 }}
          EXPECTED_MAVEN_SUBMISSION_GENERATION: ${{ steps.input.outputs.maven_submission_generation }}
          EXPECTED_NOTES_SHA256: ${{ steps.input.outputs.notes_sha256 }}
          EXPECTED_RELEASE_DIGEST: ${{ steps.input.outputs.release_digest }}
          EXPECTED_REPOSITORY: temporalio/sdk-java
          EXPECTED_RUN_ID: ${{ steps.input.outputs.run_id }}
          EXPECTED_TAG: ${{ inputs.tag }}
          EXPECTED_WORKFLOW_ID: ${{ steps.input.outputs.workflow_id }}
          GH_TOKEN: ${{ secrets.RELEASE_PUBLICATION_GITHUB_TOKEN }}
          RELEASE_ARTIFACT_BUCKET: ${{ vars.RELEASE_ARTIFACT_BUCKET }}
          RELEASE_INPUT_FILE: ${{ runner.temp }}/publication-input.json
          RELEASE_OUTPUT_FILE: ${{ runner.temp }}/fresh-inspection.json
          RELEASE_STAGE: inspect
          RH_PASSWORD: ${{ secrets.RH_PASSWORD }}
          RH_USER: ${{ secrets.RH_USER }}
          TRUSTED_AUTOMATION_ROOT: ${{ github.workspace }}/automation
          TRUSTED_WORKER_COMMIT: ${{ needs.resolve.outputs.automation_commit }}
        run: bash "$TRUSTED_AUTOMATION_ROOT/.github/scripts/temporal-release/reconcile-publication.sh"
      - name: Record protected authorization for exactly one next generation
        id: authorization
        env:
          CURRENT_GENERATION: ${{ steps.input.outputs.maven_submission_generation }}
          RELEASE_ARTIFACT_BUCKET: ${{ vars.RELEASE_ARTIFACT_BUCKET }}
          RELEASE_DIGEST: ${{ steps.input.outputs.release_digest }}
          RUN_ID: ${{ steps.input.outputs.run_id }}
          WORKFLOW_ID: ${{ steps.input.outputs.workflow_id }}
        run: |
          current=$(jq -c --argjson generation "$CURRENT_GENERATION" \
            '.mavenGenerations[]? | select(.generation == $generation)' \
            "$RUNNER_TEMP/fresh-inspection.json")
          [[ $(jq -r .mavenPresent "$RUNNER_TEMP/fresh-inspection.json") == 0 ]]
          if [[ -n "$current" ]]; then
            repository_state=$(jq -r .repositoryState <<<"$current")
            portal_state=$(jq -r .portalDeploymentState <<<"$current")
            [[ ( "$repository_state" == absent || "$repository_state" == unavailable ) &&
              ( -z "$portal_state" || "$portal_state" == FAILED ) ]]
          fi
          generation=$((CURRENT_GENERATION + 1))
          RELEASE_AUTHORIZATION_FILE="$RUNNER_TEMP/maven-retry-authorization.json" \
            RELEASE_GENERATION="$generation" RELEASE_RUN_ID="$RUN_ID" \
            RELEASE_WORKFLOW_ID="$WORKFLOW_ID" \
            bash automation/.github/scripts/temporal-release/record-maven-retry-authorization.sh
      - name: Submit Update bound to the protected inspection receipt
        working-directory: automation
        env:
          GH_TOKEN: ${{ secrets.RELEASE_APPROVAL_GITHUB_TOKEN }}
          CONTROL_GITHUB_ACTOR: ${{ steps.authorization.outputs.actor }}
          CONTROL_GITHUB_RUN_ID: ${{ steps.authorization.outputs.run_id }}
          MAVEN_RETRY_AUTHORIZATION_SHA256: ${{ steps.authorization.outputs.sha256 }}
          MAVEN_RETRY_GENERATION: ${{ steps.authorization.outputs.generation }}
          RELEASE_AUTOMATION_REF: ${{ needs.resolve.outputs.automation_commit }}
        run: >-
          ./gradlew -p .github/release-automation run
          --args="control retry-maven-submission $RELEASE_TAG $RELEASE_COMMIT"

description = '''Temporal Java SDK External Storage GCS Driver - Google Cloud Storage Client'''

apply from: "$rootDir/gradle/fakeGcsServer.gradle"

ext {
    // 2.62.0 is the newest release that keeps protobuf 3.25.x and gRPC 1.76.x, matching the
    // versions the SDK is built against. Applications can still use a newer client.
    googleCloudStorageVersion = '2.62.0'
}

dependencies {
    api project(':temporal-payload-storage-gcsdriver')
    api "com.google.cloud:google-cloud-storage:$googleCloudStorageVersion"

    // For the @Experimental annotation only.
    compileOnly project(':temporal-sdk')

    // Exercise the Google and Temporal dependencies together on the ordinary test classpath.
    testImplementation project(':temporal-serviceclient')
    testImplementation project(':temporal-sdk')
    testImplementation "junit:junit:${junitVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testRuntimeOnly group: 'ch.qos.logback', name: 'logback-classic', version: "${logbackVersion}"
}

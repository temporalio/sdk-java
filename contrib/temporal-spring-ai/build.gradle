plugins {
    id 'base'
}

description = 'Temporal Spring AI relocation'

// Remove this project after publishing the one-time relocation release.
publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                packaging = 'pom'
                distributionManagement {
                    relocation {
                        groupId = 'io.temporal'
                        artifactId = 'spring-ai'
                        version = '0.1.0'
                        message = 'Use io.temporal:spring-ai from temporalio/ai-integrations.'
                    }
                }
            }
        }
    }
}

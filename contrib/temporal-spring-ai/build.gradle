plugins {
    id 'base'
}

description = 'Temporal Spring AI relocation'

// Publish once after io.temporal:spring-ai:0.1.0 is public, then remove this project.
publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                packaging = 'pom'
                distributionManagement {
                    relocation {
                        groupId = 'io.temporal'
                        artifactId = 'spring-ai'
                        version = '0.1.0'
                        message = 'Use io.temporal:spring-ai from temporalio/ai-integrations.'
                    }
                }
            }
        }
    }
}
